<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" type="image/png">
  <title>Jewel Crush — Privacy Policy & Terms</title>
  <meta name="description" content="Política de privacidad y Términos y Condiciones de Jewel Crush - Nexy Studio" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1743;
      --ink-soft: #3a3466;
      --paper: #f5f3fc;
      --line: #dcd6f0;
      --night: #1c1743;
      --amethyst: #7a4cf0;
      --emerald: #0c9a78;
      --ruby: #d92f55;
      --topaz: #e69b00;
      --link: #5b32c9;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink-soft);
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--topaz); outline-offset: 3px; }

    /* Barra superior */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--night);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbar-in {
      max-width: 1120px; margin: 0 auto; padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .topbar img { width: 36px; height: 36px; display: block; }
    .lang { display: flex; align-items: center; gap: 12px; }
    #langLabel { color: #b9b3dd; font-size: 14px; }
    .seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); }
    .lang-btn {
      border: 0; cursor: pointer; font: 600 14px 'Instrument Sans', sans-serif;
      padding: 6px 16px; border-radius: 999px; background: transparent; color: #cfc9ee;
      transition: background .2s, color .2s;
    }
    .lang-btn:hover { color: #fff; }
    .lang-btn.active { background: #fff; color: var(--night); }

    /* Hero */
    .hero { background: var(--night); color: #fff; overflow: hidden; }
    .hero-in {
      max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px;
      display: grid; grid-template-columns: 1.2fr .8fr; align-items: center; gap: 32px;
    }
    .hero h1 {
      margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
      font-size: clamp(38px, 6vw, 72px); line-height: 1.02; letter-spacing: -.02em;
    }
    .hero p { margin: 18px 0 0; font-size: clamp(18px, 2.2vw, 24px); color: #cfc9ee; }
    .gem { width: 100%; max-width: 340px; justify-self: end; height: auto; }
    .gem polygon { opacity: 0; animation: facet .6s ease forwards; }
    .gem polygon:nth-child(1) { animation-delay: .05s; }
    .gem polygon:nth-child(2) { animation-delay: .15s; }
    .gem polygon:nth-child(3) { animation-delay: .25s; }
    .gem polygon:nth-child(4) { animation-delay: .35s; }
    .gem polygon:nth-child(5) { animation-delay: .45s; }
    .gem polygon:nth-child(6) { animation-delay: .55s; }
    @keyframes facet { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Cuerpo */
    .layout {
      max-width: 1120px; margin: 0 auto; padding: 48px 24px 24px;
      display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 56px; align-items: start;
    }
    nav.side { position: sticky; top: 84px; }
    nav.side ul { list-style: none; margin: 0; padding: 0; }
    nav.side > ul > li + li { margin-top: 22px; }
    .nav-link {
      display: block; padding: 6px 0; text-decoration: none;
      font: 700 19px 'Bricolage Grotesque', sans-serif; color: var(--ink);
    }
    .nav-link:hover { color: var(--link); }
    .toc { margin-top: 6px !important; border-left: 2px solid var(--line); }
    .toc a {
      display: block; padding: 5px 0 5px 16px; margin-left: -2px; border-left: 2px solid transparent;
      font-size: 15px; line-height: 1.4; color: var(--ink-soft); text-decoration: none;
    }
    .toc a:hover { color: var(--ink); }
    .toc a.active { color: var(--ink); font-weight: 600; border-left-color: var(--c, var(--amethyst)); }

    .doc { max-width: 68ch; scroll-margin-top: 84px; }
    .doc h2 {
      margin: 0 0 14px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
      font-size: clamp(32px, 4.4vw, 46px); line-height: 1.08; letter-spacing: -.02em; color: var(--ink);
    }
    .doc h2 + p {
      display: inline-block; margin: 0; padding: 4px 14px; border-radius: 999px;
      background: #e8e2fb; color: var(--ink); font-size: 15px; line-height: 1.5;
    }
    .doc h3 {
      --c: var(--amethyst);
      position: relative; margin: 40px 0 8px !important; padding-left: 28px;
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700;
      font-size: 22px; line-height: 1.25; color: var(--ink); scroll-margin-top: 84px;
    }
    .doc h3::before {
      content: ""; position: absolute; left: 0; top: .28em; width: 17px; height: 17px;
      background: var(--c); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
    }
    .doc h3:nth-of-type(4n+2) { --c: var(--emerald); }
    .doc h3:nth-of-type(4n+3) { --c: var(--ruby); }
    .doc h3:nth-of-type(4n+4) { --c: var(--topaz); }
    .doc p { margin: 0 0 12px; }
    .doc h2 + p + p { margin-top: 18px; }
    .doc h3 + p { margin-top: 0; }
    .doc strong { color: var(--ink); font-weight: 600; }
    .doc ul { list-style: none; margin: 10px 0 0; padding: 0 !important; }
    .doc li { position: relative; padding: 4px 0 4px 24px; }
    .doc li::before {
      content: ""; position: absolute; left: 3px; top: .8em; width: 8px; height: 8px;
      background: var(--line); transform: rotate(45deg);
    }
    .doc a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
    .doc a:hover { color: var(--ruby); }

    .sep { border: 0; height: 4px; border-radius: 4px; margin: 64px 0; max-width: 68ch;
      background: linear-gradient(90deg, var(--amethyst) 0 25%, var(--emerald) 25% 50%, var(--ruby) 50% 75%, var(--topaz) 75%); }

    footer { max-width: 1120px; margin: 0 auto; padding: 40px 24px 56px; font-size: 14px; color: #7b75a3; }
    footer p { margin: 0; border-top: 1px solid var(--line); padding-top: 24px; }

    @media (max-width: 860px) {
      .hero-in { grid-template-columns: 1fr; padding: 36px 24px 48px; }
      .gem { max-width: 150px; justify-self: start; order: -1; }
      .layout { grid-template-columns: 1fr; gap: 28px; padding-top: 28px; }
      nav.side { position: static; }
      nav.side > ul { display: flex; gap: 10px; flex-wrap: wrap; }
      nav.side > ul > li + li { margin-top: 0; }
      .nav-link { padding: 8px 18px; border-radius: 999px; background: #e8e2fb; font-size: 16px; }
      .toc { display: none; }
      #langLabel { display: none; }
      .doc { scroll-margin-top: 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .gem polygon { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 360'><polygon points='20,120 120,30 140,120' fill='%23e69b00'/><polygon points='120,30 280,30 260,120 140,120' fill='%23ffd45c'/><polygon points='280,30 380,120 260,120' fill='%23d92f55'/><polygon points='20,120 140,120 200,340' fill='%237a4cf0'/><polygon points='140,120 260,120 200,340' fill='%23a98bf7'/><polygon points='260,120 380,120 200,340' fill='%230c9a78'/></svg>" alt="Futuristic Gem Icon" />
      <div class="lang">

        <polygon points="140,120 260,120 200,340" fill="#a98bf7"/>
        <polygon points="260,120 380,120 200,340" fill="#0c9a78"/>

    </div>
  </section>

    <main>

      </article>

      <hr class="sep" />

        privacy_title: '<h2 class="text-2xl font-bold text-slate-100">Política de Privacidad</h2>',
        privacy_html: `
          <p class="mt-2">Última actualización: <strong>12 de septiembre de 2025</strong></p>
          <p class="mt-3">Gracias por jugar <strong>Jewel Crush</strong> ("el Juego"), creado por <strong>Nexy Studio</strong>. Respetamos su privacidad y queremos ser transparentes.</p>

          <h3 class="mt-4 font-semibold">1. Información que NO recopilamos</h3>

          <h3 class="mt-4 font-semibold">2. Información que sí recopilamos</h3>
          <p>Además del nombre de jugador requerido para la tabla de clasificación, el Juego integra SDKs de terceros de publicidad y analítica (como Appnext, ADX y Pangle). Estos SDKs pueden recopilar automáticamente <strong>identificadores de dispositivo</strong> (por ejemplo: ID de publicidad, ID de Android, IMEI o dirección MAC) con fines de mostrar anuncios personalizados o contextuales, medir el rendimiento y prevenir fraudes.</p>

          <h3 class="mt-4 font-semibold">3. Seguridad</h3>
          <p>No almacenamos datos sensibles. El nombre de jugador solo se usa para mostrar puntuaciones en la tabla de clasificación.</p>

        terms_title: '<h2 class="text-2xl font-bold text-slate-100">Términos y Condiciones</h2>',
        terms_html: `

    const COLORS = ['var(--amethyst)', 'var(--emerald)', 'var(--ruby)', 'var(--topaz)'];
    let observer = null;

    // Genera el índice lateral a partir de los títulos que ya existen (sin añadir texto nuevo)
    function buildToc() {
      document.querySelectorAll('nav.side .toc').forEach(el => el.remove());
      if (observer) observer.disconnect();
      const targets = [];
      ['privacy', 'terms'].forEach(id => {
        const li = document.querySelector('nav.side a[href="#' + id + '"]').parentElement;
        const ul = document.createElement('ul');
        ul.className = 'toc';
        document.querySelectorAll('#' + id + ' h3').forEach((h, i) => {
          h.id = id + '-' + (i + 1);
          const a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent;
          a.style.setProperty('--c', COLORS[i % 4]);
          li.appendChild(ul).appendChild(document.createElement('li')).appendChild(a);
          targets.push(h);
        });
      });
      observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            document.querySelectorAll('.toc a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
          }
        });
      }, { rootMargin: '-90px 0px -65% 0px' });
      targets.forEach(t => observer.observe(t));
    }

    function setLanguage(lang) {
      const data = CONTENT[lang] || CONTENT['en'];
      document.getElementById('siteTitle').textContent = data.siteTitle;
      document.getElementById('siteSubtitle').textContent = data.siteSubtitle;
      document.getElementById('langLabel').textContent = data.langLabel;
      document.getElementById('privacy').innerHTML = data.privacy_title + data.privacy_html;
      document.getElementById('terms').innerHTML = data.terms_title + data.terms_html;
      document.getElementById('footerText').textContent = data.footer;
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      document.documentElement.lang = (lang === 'es') ? 'es' : 'en';
      try { localStorage.setItem('jewelcrush_lang', lang); } catch (e) {}
      buildToc();
    }

    function detectAndApply() {
      let saved = null;
      try { saved = localStorage.getItem('jewelcrush_lang'); } catch (e) {}
      if (saved) { return setLanguage(saved); }
      const nav = navigator.languages && navigator.languages.length ? navigator.languages[0] : (navigator.language || 'en');
      const short = String(nav).toLowerCase().startsWith('es') ? 'es' : 'en';
      setLanguage(short);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
      });
      detectAndApply();
    });
  </script>
</body>
</html>
